# Weekly standards hygiene for docs/References.md (links + RFC metadata)
# and naming denylist report. Report-only tools exit 0 on findings.
#
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onschedule

name: Standards check

on:
  schedule:
  - cron: '0 6 * * 1'

  workflow_dispatch: {}

  push:
    branches:
    - main
    paths:
    - docs/References.md
    - docs/plans/naming-standards.md
    - tools/check-standard-links.mjs
    - tools/check-naming-denylist.mjs
    - .github/workflows/standards-check.yml

permissions:
  contents: read

jobs:
  references-and-naming:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Reference links and RFC status
      run: node tools/check-standard-links.mjs

    - name: Naming denylist (report-only)
      run: node tools/check-naming-denylist.mjs